# Keeps the free Render instance warm so reviewers do not wait ~50 s on first load.
# Render's free tier sleeps after 15 min idle; a ping every 10 min prevents that.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 90 https://clearhaul.onrender.com/api/health
